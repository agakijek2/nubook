<!DOCTYPE html>
<!-- Look at this page over a server, not by double-clicking it. Every link in
     it runs from the root, because GitHub Pages serves it at any depth - and
     under file:// the root is the root of the disk, so the stylesheet is not
     found and the page renders unstyled. To see it:

         python3 -m http.server 8000
         http://localhost:8000/404.html
-->
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nubook. — nie ma takiej strony</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  /* This is not a view of the shop but a separate file that GitHub Pages
     serves at an unknown address. The header and the footer are the shop's own;
     only what stands between them is local to this page, because the shop has
     no such view. */
  body{ display:flex; flex-direction:column; min-height:100dvh }
  .nf{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:var(--nu-space-medium); text-align:center;
    padding:var(--nu-space-max) var(--nu-space-small);
  }
  .nf h1{ font:var(--nu-type-h1); margin:0 }
  /* The same measure as a product description: the line length is the same
     decision here as it is there, so it takes the same value. */
  /* The same step and the same colour as the lede in the documentation: the
     sentence under the title does the same job here, so it looks the same. */
  .nf p{ font:var(--nu-type-body-l); color:var(--nu-fg-secondary); margin:0; max-width:42ch }
  .nf-actions{ display:flex; align-items:center; gap:var(--nu-space-medium); flex-wrap:wrap; margin-top:var(--nu-space-micro) }
</style>
</head>
<body>

<!-- The shop's header without the switchers and the icons. Language, currency
     and scheme live in the shop's script, and a control that does nothing is
     worse than no control: the reader presses it and nothing happens. What is
     left is what makes sense on an error page - the wordmark, the strapline and
     the way home. -->
<header>
  <div class="logo">
    <a class="mark" href="/" id="logoLink">nubook</a>
    <span class="strap" id="strap">powieści o kobietach i płci</span>
  </div>
</header>

<main class="nf">
  <h1 id="nfTitle">Nie ma takiej strony.</h1>
  <p id="nfLede">Wróć do sklepu, żeby poznać nasze tytuły.</p>
  <div class="nf-actions">
    <a class="btn-primary" href="/" id="cta">Do sklepu</a>
  </div>
</main>

<footer class="site-foot">
  <div class="foot-left">
    <span class="foot-mark">nubook<span class="foot-dot">.</span></span>
    <span class="foot-copy" id="footCopy"></span>
  </div>
  <nav class="foot-links">
    <a class="foot-link link" href="/#design/roadmap" id="lnkAbout">O tym projekcie</a>
    <a class="foot-link link" href="/#design" id="lnkDesign">Design system</a>
  </nav>
</footer>

<script>
/* The reader has already chosen a language and a scheme once; an error page is
   no reason to ask a second time. The key and the shape of the record are the
   shop's own, and every value is checked, because the record may come from
   another version of the shop or not exist at all. */
(function(){
  var el = document.getElementById.bind(document);
  var p = {};
  try { p = JSON.parse(localStorage.getItem("nubook.prefs.v1") || "{}") || {}; }
  catch (e) { p = {}; }

  if (p.scheme === "light" || p.scheme === "dark")
    document.documentElement.setAttribute("data-scheme", p.scheme);

  var year = new Date().getFullYear();

  if (p.lang !== "en"){                 // Polish is the default, as in the shop
    el("footCopy").textContent = "© " + year + " nubook. Wszelkie prawa zastrzeżone.";
    return;
  }

  document.documentElement.lang = "en";
  document.title = "nubook. — no such page";
  el("strap").textContent = "novels on women & gender";
  el("nfTitle").textContent = "No such page.";
  el("nfLede").textContent = "Go back to the shop to see what we have.";
  el("cta").textContent = "To the shop";
  el("lnkAbout").textContent = "About this project";
  el("lnkDesign").textContent = "Design system";
  el("footCopy").textContent = "© " + year + " nubook. All rights reserved.";
})();
</script>

</body>
</html>
