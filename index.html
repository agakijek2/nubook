<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nubook. — novels on women &amp; gender</title>

<!-- Wklejony link pokazuje to, co znajdzie tutaj, a nie goły adres. Adresy są
     pełne, bo scraper Slacka czy LinkedIna nie dopowiada sobie ścieżki
     względnej. Karta jest jedna i po angielsku: wybiera ją serwer, nie
     czytelniczka, a link idzie do portfolio. -->
<meta name="description" content="An online bookshop for novels about women and gender, where books are browsed by what they are about: fifteen motifs, each with a named source. Built with its own documented design system.">
<link rel="canonical" href="https://nubook.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nubook.">
<meta property="og:url" content="https://nubook.com/">
<meta property="og:title" content="nubook. — books, by what they are about">
<meta property="og:description" content="Fifteen motifs, each with a named source, instead of genre and bestseller rank. Plus the design system the shop is built on.">
<meta property="og:image" content="https://nubook.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The nubook wordmark above the line 'Books, by what they are about.', with six motif names beneath it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="nubook. — books, by what they are about">
<meta name="twitter:description" content="Fifteen motifs, each with a named source, instead of genre and bestseller rank. Plus the design system the shop is built on.">
<meta name="twitter:image" content="https://nubook.com/assets/og.png">

<!-- Kropka ze znaku. Litera w szesnastu pikselach i tak się nie przeczyta. -->
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Only what the stylesheet actually asks for: Archivo 400 and 500 plus its
     italic for book quotes, and DM Serif Display roman. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- The first thing the Tab key finds on every view: a way past the promotion
     and the header, straight to the content. It has to be the first focusable
     element in the document, so it stands above the promotion bar. -->
<a class="skip-link" id="skipLink" href="#content">Przejdź do treści</a>

<!-- Everything that stays at the top of the window while the reader scrolls:
     the promotion, the header and, on a product page, the way back out of it.
     One element rather than three sticky ones, so the block's height is whatever
     it happens to contain - the row is hidden off the product view and the block
     simply gets shorter, with nothing to recalculate.
     The controls over the grid are deliberately not here. A field is for typing
     into, and it reads worst of all while the shelf slides behind it, so the bar
     holding it stays with the shelf it narrows. -->
<div class="masthead" id="masthead">

<!-- The blur, in four layers. One layer can only be on or off at a given point,
     which reads as a change of opacity rather than of focus; four, each blurring
     twice as much as the one below and each fading in higher up, give a ramp
     that is clear at the bottom edge and thickest at the top. Purely visual, so
     it is hidden from anything that reads the page aloud. -->
<div class="masthead-veil" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<!-- Shop-wide promotion. Sits above the header so it is the first thing read,
     and it is the one place in the shop that runs on an inverse ground. -->
<div class="promo" id="promo">
  <p>
    <span id="promoCopy">10% rabatu na wszystkie tytuły z kodem</span>
    <button type="button" class="btn-tertiary has-icon" id="promoCode">
      <span class="lbl" id="promoCodeLabel">ROOM10</span>
      <svg class="ico-copy ico-sm" data-icon="sheets" aria-hidden="true"></svg>
      <svg class="ico-check ico-sm" data-icon="check" aria-hidden="true"></svg>
    </button>
    <span class="promo-done" id="promoDone" role="status" aria-live="polite"></span>
  </p>
</div>

<header>
  <div class="logo">
    <!-- The wordmark is the way back to the grid, from any view including the
         documentation, where this header stays visible. An address, so an anchor:
         the same "#" the documentation footer already goes home by. -->
    <a class="mark" href="#" id="logoLink">nubook</a>
    <span class="strap" id="strap">powieści o kobietach i płci</span>
  </div>
  <div class="head-right">
    <div class="switchers">
      <!-- Language and currency answer questions about the content; the scheme
           answers one about the surface. Two blocks, a step apart. -->
      <div class="sw-content">
      <div class="sw-group" role="group" aria-label="Language">
        <button type="button" class="chip" id="swEN" aria-pressed="false"><span class="chip-t">EN</span></button><span>/</span><button type="button" class="chip" id="swPL" aria-pressed="true"><span class="chip-t">PL</span></button>
      </div>
      <div class="sw-group" role="group" aria-label="Currency">
        <button type="button" class="chip" id="swEUR" aria-pressed="false"><span class="chip-t">EUR</span></button><span>/</span><button type="button" class="chip" id="swPLN" aria-pressed="true"><span class="chip-t">PLN</span></button>
      </div>
      </div>
      <!-- A third pair on the same terms as the two before it. Neither chip is
           pressed until somebody chooses: until then the shop follows the
           reader's system, which is a setting they already made. -->
      <div class="sw-group" role="group" aria-label="Motyw">
        <button type="button" class="chip" id="swLight" aria-pressed="false"><span class="chip-t">Jasny</span></button><span>/</span><button type="button" class="chip" id="swDark" aria-pressed="false"><span class="chip-t">Ciemny</span></button>
      </div>
    </div>
    <div class="head-icons">
      <button type="button" class="btn-tertiary" id="btnFav" aria-label="Ulubione"><svg class="ico-lg" data-icon="heart" aria-hidden="true"></svg></button>
      <button type="button" class="btn-tertiary" id="btnAccount" aria-label="Konto"><svg class="ico-lg" data-icon="figure" aria-hidden="true"></svg></button>
      <button type="button" id="btnCart" class="cart-wrap btn-tertiary" aria-label="Koszyk"><svg class="ico-lg" data-icon="bag" aria-hidden="true"></svg><span class="cart-n" id="cartN" hidden>0</span></button>
    </div>
  </div>
</header>


<!-- The same row on a product page, holding the one control that view offers
     above its content. It stays in the block: on a product page there is no bar
     over a grid, and the way out has to be reachable wherever the reader has
     scrolled to. -->
<div class="productbar" id="productbar" hidden>
  <button type="button" class="back btn-tertiary has-icon" id="backBtn"></button>
</div>

</div><!-- /.masthead -->

<!-- Where the skip link lands. It sits right after everything that repeats from
     view to view, so the link skips the promotion and the navigation in one go
     and lands on what the reader came for. -->
<div id="content" tabindex="-1"></div>

<div class="shopbar" id="shopbar">
  <button class="filter-toggle btn-tertiary has-icon" id="filterToggle" aria-expanded="true" aria-controls="filters">
    <svg class="ico-sm ico-filter" data-icon="filter" aria-hidden="true"></svg><span id="lblFilter">Filtry</span>
  </button>
  <!-- Search stands with the other two controls over the grid, because that is
       what it is: a third way of narrowing the same list. The magnifier sits
       inside the field, on the terms the select already set for its chevron. -->
  <div class="search-wrap">
    <svg class="ico-search ico-sm" data-icon="search" aria-hidden="true"></svg>
    <input type="search" class="input in-bar" id="searchInput" autocomplete="off" placeholder="Szukaj tytułu lub autorki" aria-label="Szukaj tytułu lub autorki">
    <button type="button" class="btn-tertiary search-clear" id="searchClear" hidden aria-label="Wyczyść"><svg class="ico-sm ico-close" data-icon="cross" aria-hidden="true"></svg></button>
  </div>
  <div class="sort" id="sort">
    <button class="sort-btn btn-tertiary has-icon" id="sortBtn" aria-haspopup="menu" aria-expanded="false">
      <span id="lblSort">Sortuj:</span> <span id="sortLbl">Nasze rekomendacje</span> <svg class="ico-sm ico-plus" data-icon="plus" aria-hidden="true"></svg>
    </button>
    <div class="sort-menu" role="menu" id="sortMenu">
      <button type="button" role="menuitemradio" tabindex="-1" data-sort="featured" aria-checked="true"><span class="lbl">Our recommendations</span></button>
      <button type="button" role="menuitemradio" tabindex="-1" data-sort="newest" aria-checked="false"><span class="lbl">Newest first</span></button>
      <button type="button" role="menuitemradio" tabindex="-1" data-sort="price-asc" aria-checked="false"><span class="lbl">Price, low to high</span></button>
      <button type="button" role="menuitemradio" tabindex="-1" data-sort="pub-asc" aria-checked="false"><span class="lbl">First published: oldest</span></button>
    </div>
  </div>
</div>

<div class="shop" id="shop">
  <aside class="filters" id="filters">
    <!-- only rendered when this same panel is raised as a bottom sheet on mobile -->
    <div class="fsheet-head">
      <span id="lblFilterSheet">Filtry</span>
      <button type="button" class="btn-tertiary" id="fsheetClose" aria-label="Zamknij"><svg class="ico-sm ico-close" data-icon="cross" aria-hidden="true"></svg></button>
    </div>
    <div class="filter-row" role="group" aria-labelledby="lblGenre">
      <span class="filter-label" id="lblGenre">Gatunek</span>
      <div class="chip-row" id="genreRow"></div>
    </div>
    <div class="filter-row" role="group" aria-labelledby="lblTag">
      <span class="filter-label" id="lblTag">Tag</span>
      <div class="chip-row" id="statusRow"></div>
    </div>
    <div class="filter-row" role="group" aria-labelledby="lblLang">
      <span class="filter-label" id="lblLang">Język</span>
      <div class="chip-row" id="langRow"></div>
    </div>
  </aside>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<div class="sheet-backdrop" id="fsheetBg"></div>

<div class="drawer-backdrop" id="drawerBg"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="drawer-close btn-tertiary" id="drawerClose" aria-label="Zamknij"><svg class="ico-sm ico-close" data-icon="cross" aria-hidden="true"></svg></button>
  <div id="drawerBody"></div>
</aside>

<div class="drawer-backdrop" id="cartBg"></div>
<aside class="drawer cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="drawer-close btn-tertiary" id="cartClose" aria-label="Zamknij"><svg class="ico-sm ico-close" data-icon="cross" aria-hidden="true"></svg></button>
  <h2 id="cartTitle">Koszyk</h2>
  <div id="cartBody"></div>
</aside>

<section class="checkout" id="cartPage" hidden></section>
<section class="checkout" id="checkout" hidden></section>
<section class="done-view" id="doneView" hidden></section>
<section class="ds" id="dsPage" hidden></section>

<section class="product" id="product" hidden>
  <!-- filled by renderProduct: the arrow is drawn, not typed, so it cannot live in the translated string -->
  <div class="p-grid" id="pGrid"></div>
</section>

<!-- Sticky checkout bar (mobile only). Kept OUTSIDE .checkout on purpose: that
     section runs a transform animation on entry, which would make a fixed
     descendant position against the section instead of the viewport. The button
     reaches the form by id, so it can submit from out here. -->
<div class="co-bar" id="coBar" hidden></div>

<!-- The bookseller. She speaks on two events and is silent everywhere else, so
     this element carries no content of its own: the shop fills it at the moment
     it has something to offer. Not a dialogue and never modal - the reader can
     go on using the page with it open, which is why there is no scrim, no inert
     and no focus trap. The panel is announced politely rather than interrupting,
     because nothing here has to be read before anything else. -->
<aside class="bs" id="bookseller" hidden>
  <div class="bs-panel" id="bsPanel" role="status" aria-live="polite" hidden>
    <button type="button" class="bs-close btn-tertiary" id="bsClose"><svg class="ico-sm ico-close" data-icon="cross" aria-hidden="true"></svg></button>
    <p class="bs-say" id="bsSay"></p>
    <!-- The proposals are what she opened the panel to show, so they stand
         there from the start: the sentence above names two books and the two
         books are under it, with nothing to press in between. -->
    <div class="bs-list" id="bsList"></div>
  </div>
  <!-- She stays on the page once the offer is dismissed, so this is a control
       rather than a decoration: pressing it brings the panel back. -->
  <button type="button" class="bs-ava" id="bsAva" aria-expanded="false" aria-controls="bsPanel"><span class="bs-dot" aria-hidden="true"></span></button>
</aside>

<footer class="site-foot" id="siteFoot">
  <div class="foot-left">
    <span class="foot-mark">nubook<span class="foot-dot">.</span></span>
    <span class="foot-copy" id="footCopy"></span>
  </div>
  <!-- Two links, both backstage. The second goes to the roadmap tab rather than
       announcing itself as a roadmap: a shop's footer is where a reader looks
       for delivery and returns, so the label is the one a reader would use. -->
  <nav class="foot-links">
    <a class="foot-link link" id="lnkAbout" href="#design/roadmap">O tym projekcie</a>
    <a class="foot-link link" id="lnkDesign" href="#design">Design system</a>
  </nav>
</footer>

<script src="js/app.js"></script>
</body>
</html>
